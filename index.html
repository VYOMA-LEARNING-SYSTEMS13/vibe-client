  <script>
    // Suppress non-critical console warnings in development
    const originalWarn = console.warn;
    const originalError = console.error;

    console.warn = function (...args) {
      const message = args.join(' ');
      // Suppress specific warnings that are not critical
      if (message.includes('cdn.tailwindcss.com should not be used in production') ||
        message.includes('Using CacheFirst to respond to') ||
        message.includes('Router is responding to') ||
        message.includes('installHook.js:1') ||
        message.includes('apple-mobile-web-app-capable') ||
        message.includes('deprecated')) {
        return;
      }
      originalWarn.apply(console, args);
    };

    console.error = function (...args) {
      const message = args.join(' ');
      // Log critical errors but suppress known non-critical ones
      if (!message.includes('workbox-') &&
        !message.includes('installHook.js') &&
        !message.includes('pwa-192x192.png') &&
        !message.includes('pwa-512x512.png') &&
        !message.includes('Download error or resource isn\'t a valid image')) {
        originalError.apply(console, args);
      }
    };

    // Handle unhandled promise rejections
    window.addEventListener('unhandledrejection', function (event) {
      console.log('Unhandled promise rejection:', event.reason);
      event.preventDefault();
    });
  </script>
